# Frigate Learn example configuration.
# Copy to config.yaml. ${VAR} references are interpolated from the environment
# (optionally provided by .env). Never put real secrets in this file.

# --- Which classes does this deployment care about? -------------------------
classes:
  - person
  - car
  - bicycle
  - motorcycle
  - bus
  - truck
  - dog
  - cat

frigate:
  base_url: "http://192.168.1.10:8971"   # or http://frigate:8971
  token: "${FRIGATE_TOKEN}"
  timeout_seconds: 30

collection:
  # default window used by `frigate-learn collect` when --from is omitted
  default_days: 7
  # cameras: [] means all cameras. Otherwise, e.g. ["driveway", "front-door"].
  cameras: []
  # labels: [] means all labels. Otherwise, e.g. ["person", "car"].
  labels: []
  # review severities collected by default: "detection" and/or "alert"
  severity:
    - detection
    - alert
  # optional caps
  max_reviews: null
  max_events: null
  # parallel snapshot downloads (never on the Frigate VM - this runs elsewhere)
  concurrency: 8
  download_timeout_seconds: 60
  # store the annotated (debug) snapshot alongside the clean training image
  keep_annotated_snapshots: false
  # P3 near-duplicate suppression. Exact SHA-256 duplicates are always skipped;
  # phash_threshold (0..64 Hamming bits) additionally drops near-identical
  # frames from the same camera.
  dedup_enabled: true
  phash_threshold: 10
  # region-crop collection (default on): download server-side crops
  # (snapshot.jpg?crop=1&bbox=0&height=<H>) matching the detector input instead
  # of full frames; the VLM labels those crops. False restores full-frame
  # collection. region_crop_height falls back to training.image_size when null.
  region_crop: true
  region_crop_height: null
  # review-sync policy: if the operator marks a Frigate review segment as
  # reviewed in Frigate's own Review UI, samples under that segment get
  # quality=useful when they have no explicit verdict yet (the raw flag is
  # always mirrored into samples.frigate_reviewed).
  review_auto_useful: true

sampling:
  # P3 - temporal sampling within an event. Off by default; when enabled,
  # `collect` grabs up to max_samples_per_event frames per event (optionally a
  # resampled snapshot via Frigate's snapshot timestamp parameter).
  enabled: false
  max_samples_per_event: 3
  min_seconds_between_samples: 2

# P4/P8 - VLM liason (openai-compatible chat completions endpoint).
# base_url/api_key can come from the environment instead of this file.
vlm:
  enabled: false
  provider: "openai"          # expects /v1/chat/completions with an image_url
  model: "gpt-4o-mini"
  base_url: "${VLM_BASE_URL:-https://api.openai.com/v1}"
  api_key: "${VLM_API_KEY}"
  batch_size: 4
  temperature: 0.0
  timeout_seconds: 120
  # "{classes}" is interpolated with the configured class names.
  system_prompt: >
    You are a precise object-detection annotator. Return ONLY a JSON object of
    the form {"objects": [{"label": <class>, "confidence": 0..1,
    "bbox": [x1, y1, x2, y2]} ...]} with normalized coordinates in [0, 1].
    Classes allowed: {classes}. Use an empty objects list if nothing is present.

training:
  image_size: 320
  epochs: 50
  model: "yolov8n"            # base weights for `frigate-learn train`
  batch: 16
  device: null                # e.g. "cuda:0", "cpu", "hailo" (later phases)
  freeze: null                # freeze first N backbone layers (usually null/10)
  project: null               # output dir for runs (default: data/training)
  seed: 1234
  # coco80: keep the full COCO-80 label head, freeze the 72 non-configured classes.
  #         subset: compact head over the configured classes (legacy).
  label_space: coco80
  lr0: null                   # initial LR override; null -> trainer default
  lrf: null                   # final LR factor override; null -> trainer default

evaluation:
  golden_dataset: "golden-v001"
  # candidate models compared on the golden dataset; the deployment baseline is
  # picked from this list (see deployment.baseline below).
  candidates:
    - "yolov8n"
    - "yolov8s"
    - "yolov8l"

deployment:
  max_latency_ms: 20
  min_recall_delta: -0.01
  min_map50_delta: -0.01
  max_cpu_percent: 80
  # FP-rate regression floor: a candidate may not exceed the baseline
  # false_positive_rate by more than this (absolute). Blocks recall-chasing
  # models that deploy more false positives.
  max_fp_rate_delta: 0.05
  # name (in evaluation.candidates) treated as the incumbent the gate compares
  # candidates against. Gate PASS requires a candidate to stay within all deltas
  # of this model.
  baseline: "yolov8l"

# P12 - Hailo ONNX -> HEF compile (see docs/hailo-deploy.md). Compilation runs
# host-side and never needs a Hailo device. The Dataflow Compiler runs only on
# x86-64 Linux, so on macOS it executes inside hailo.docker_image.
hailo:
  hw_arch: "hailo8"            # Frigate box: Hailo-8 (not hailo8l)
  docker_image: null           # e.g. "frigate-learn-hailo-dfc:3.34.0" on macOS; null on Linux with native DFC
  calib_images: null           # dir of camera frames (.jpg/.png) for quantization; null -> random calib fallback
  calib_samples: 64
  interactive: false           # non-interactive DFC: auto-accept NMS/reparse prompts

# P13 - what `frigate-learn run` (and the nightly cron) executes.
automation:
  enable:
    - collect
    - build
  till: "build"               # stop at this stage (inclusive)
  schedule: "0 3 * * *"       # cron shown in the systemd timer docs


# --- Dataset audit & pseudo-labeling (frigate-learn audit run) -----------
# SAM 3.1 (MLX, Apple Silicon) segments each existing Frigate crop; a VLM
# (oMLX) independently verifies the object; sample is kept only when both
# agree. Labels and classes always come from the Frigate vocabulary.
audit:
  pipeline_version: 1            # bump to invalidate all cached decisions
  max_consecutive_vlm_errors: 5  # abort when the VLM server is down this many samples in a row
  input: "data"                  # dataset root containing frigate.db + images/ or annotations/manifest.json
  output: "audit"                # per-sample caches + decisions + provenance
  training: "training_audit"     # exported positives/hard negatives + classes.txt
  hard_negatives_enabled: false  # export VLM-confirmed false positives as hard negatives
  negative_sampling_enabled: false
  samples_per_crop: 0            # optional in-crop random background negatives
  models:
    sam:
      # backend: "mlx" (default) runs SAM 3.1 on this machine (Apple Silicon +
      # sam3_mlx, the `audit` extra). "http" calls a remote
      # `frigate-learn sam-server` endpoint (see the remote-mode keys below)
      # so the pipeline can run on a small VM that only performs HTTP calls.
      backend: "mlx"
      checkpoint: ""             # path to converted SAM 3.1 weights ("" -> HF repo)
      load_from_hf: true
      hf_repo: "mlx-community/sam3-image"   # native sam3_mlx format; quantized HF repos (sam3-8bit/4bit) are transformers-format and incompatible
      quantize_bits: 0           # 0 = keep precision; 4/8 = in-memory mx.quantize (breaks sam3_mlx decoder heads upstream)
      resolution: 1008           # SAM image resolution, multiple of 14
      confidence_threshold: 0.5  # minimum object-presence score to keep a candidate
      candidate_classes: []      # extra classes SAM is asked about (Frigate class always asked)
      # --- remote mode (backend: "http") -------------------------------
      # base_url: "http://192.168.1.50:8001"   # frigate-learn sam-server endpoint
      # api_key: "${SAM_SERVER_KEY}"           # optional Bearer token the server checks
      # model: "sam3-1"                        # cache-key label; bump when server weights change
      # timeout_seconds: 120.0                 # hard wall-clock deadline per attempt
      # max_retries: 2                         # extra attempts on transport/5xx failures
    vlm:
      base_url: "http://127.0.0.1:8080/v1"   # oMLX OpenAI-compatible endpoint
      model: ""                  # VLM model name loaded in oMLX
      temperature: 0.0
      timeout_seconds: 180.0
      max_retries: 2
      json_mode: true
  geometry:
    # Deterministic quality gates on the SAM result. All defaults are
    # opt-in disabled: they only record metrics, never reject. Validate
    # values on your data before enabling any gate.
    min_mask_area: 0             # e.g. 48 px
    min_bbox_iou: 0.0            # IoU(SAM bbox, Frigate bbox), e.g. 0.3
    mask_bbox_ratio_min: 0.0     # mask area / SAM bbox area, e.g. 0.2
    mask_bbox_ratio_max: 9999.0  # ... upper bound, e.g. 1.2
    min_mask_frigate_containment: 0.0  # fraction of mask pixels inside Frigate bbox, e.g. 0.6
# --- Paths ---------------------------------------------------------------
# All paths are resolved relative to this file's directory.
data:
  root: "data"
  images: "images"
  previews: "previews"
  datasets: "datasets"
  golden: "golden"
  database: "frigate_learn.db"   # under data/ root
  migrations: "migrations"