[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frigate-learn"
version = "0.2.0"
description = "Active-learning / auto-training pipeline for a Frigate NVR deployment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "asxzy" }]
keywords = ["frigate", "computer-vision", "active-learning", "hailo", "yolo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "Pillow>=10.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
vlm = []
audit = [
    # SAM 3.1 teacher (MLX, Apple Silicon only; needs Python 3.13).
    "sam3-mlx>=0.1.1",
]
ml = [
    "numpy>=1.26",
    "ultralytics>=8.2",   # heavy: pulls torch; only needed on the training machine
]
# Hailo Dataflow compiler lives on the training/compilation host, not pip'able.

[project.scripts]
frigate-learn = "frigate_learn.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frigate_learn = ["migrations/*.sql", "webapp/static/*", "webapp/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"